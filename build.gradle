plugins {
    id 'java-library'
    id 'maven-publish'
}

// ⚠️ Die Gegenprobe zum Befehlswaechter. Sie belegt, dass die fuenf Proben in
// tools/befehlswaechter.py wirklich pruefen - dieser Waechter haengt in ACHT Repos, und eine
// verrutschte Regex dort macht sie alle zugleich gruen ueber ungesehenem Befehlscode.
// ⚠️ Kein `if (isFile())` ohne throw: eine Anbindung, die bei einem Tippfehler still aussetzt,
// ist keine. Die Datei liegt in DIESEM Repo, sie kann nicht "berechtigt fehlen".
def gegenprobe = file("${rootDir}/gradle/waechter-gegenprobe.gradle")
if (!gegenprobe.isFile()) {
    throw new GradleException(
        "${gegenprobe} fehlt - die Gegenprobe zum Befehlswaechter waere stillschweigend weg," +
        " und der Waechter in acht Repos damit wieder unbelegt.")
}
apply from: gegenprobe

group = 'net.zanoria'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    api 'com.google.code.gson:gson:2.10.1'
    // ⚠️ api und nicht implementation: der Lader gibt snakeyaml-Typen nicht nach aussen, aber
    // beide Konsumenten fuehren snakeyaml ohnehin selbst. api haelt die Fassung an EINER Stelle
    // fest - zwei Konsumenten mit zwei Fassungen desselben Parsers waren hier schon einmal die
    // Ursache eines Unterschieds, der erst im Betrieb auffiel.
    api 'org.yaml:snakeyaml:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'zanoria-common'
        }
    }
}
