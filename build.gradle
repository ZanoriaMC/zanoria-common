plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'net.zanoria'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    api 'com.google.code.gson:gson:2.10.1'
    // ⚠️ api und nicht implementation: der Lader gibt snakeyaml-Typen nicht nach aussen, aber
    // beide Konsumenten fuehren snakeyaml ohnehin selbst. api haelt die Fassung an EINER Stelle
    // fest - zwei Konsumenten mit zwei Fassungen desselben Parsers waren hier schon einmal die
    // Ursache eines Unterschieds, der erst im Betrieb auffiel.
    api 'org.yaml:snakeyaml:2.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'zanoria-common'
        }
    }
}
