// ═══════════════════════════════════════════════════════════════════════════════════════════
//  Befehlswaechter — Gradle-Anbindung
//
//  EINBINDEN in einem Plugin-Repo, in dessen build.gradle (bzw. plugin/build.gradle):
//
//      def waechter = file("${rootDir}/../zanoria-common/gradle/befehlswaechter.gradle")
//      if (file("${rootDir}/../zanoria-common").isDirectory()) {
//          if (!waechter.isFile()) {
//              throw new GradleException(
//                  "zanoria-common ist da, aber ${waechter} fehlt - der Befehlswaechter waere" +
//                  " stillschweigend weg. Das ist genau die Bauart Fehler, gegen die er steht.")
//          }
//          apply from: waechter
//      }
//
//  ⚠️ WAS ER DANN PRUEFT - das DESKRIPTOR-MODUL, NICHT das ganze Repo.
//  Der Task unten uebergibt ``project.rootDir``. Das ist kein Versehen, aber es heisst NICHT
//  "das ganze Repo": das Skript benutzt den Pfad nur zum FINDEN der Deskriptoren. Die
//  gepruefte Quellenmenge sammelt ``module_finden()`` je Deskriptor allein unter dem
//  Verzeichnis, in dem die paper-plugin.yml/plugin.yml liegt. Ein Nachbarmodul OHNE eigenen
//  Deskriptor liefert keine einzige Datei.
//  ⚠️ SCHADEN: Befehlscode im Nachbarmodul bleibt ungesehen - keine Meldung, Rueckgabe 0,
//  im Log nichts. Der einzige Zeuge ist die Zahl in "geprueft N Deskriptor(en), M
//  Java-Datei(en)"; wer sie nicht gegen den Bestand haelt, liest ein gruenes Urteil ueber
//  einen Ausschnitt. Am 2026-08-22 gemessen: NexusStrike 101 Dateien im Repo / 54 gemeldet,
//  ZanUI 49 / 9. Die uebrigen sechs angebundenen Repos (Nexus 568/568, RelicWars 183/183,
//  Showdown 65/65, ZanoriaCommands 6/6, ZanoriaLobby 5/5, CoreClash 145/145 seit dem
//  2026-08-22) sind einmodulig - dort deckt sich beides, aber nur solange das so bleibt.
//  Wer das aendern will, aendert dieses Skript - und das trifft alle Verbraucher zugleich.
//
//  ⚠️ OFFENE ENTSCHEIDUNG, NICHT GEDULDET - Stand 2026-08-22, sie gehoert Corwis.
//  ZanUI ist der schlimmste Fall: 40 von 49 Dateien ungewacht, VIER FUENFTEL - und zwar in dem
//  Repo, dessen eigener Vorfall vom 2026-08-20 diesen Waechter ueberhaupt erzwungen hat. Die
//  Erweiterung, die das schliessen wuerde (Nachbarmodule ohne eigenen Deskriptor mit in die
//  Quellenmenge von ``module_finden()`` nehmen), liegt als VORLAGE vor und ist BEWUSST NICHT
//  gebaut.
//  ⚠️ Der Grund steht genau hier: diese Datei und das Skript daneben haben ACHT Verbraucher.
//  Eine Reichweitenaenderung wird nicht in einem Repo wirksam, sondern in allen zugleich - in
//  NexusStrike zieht sie 47 bisher ungesehene Dateien in den Bau, und wenn dort etwas faellt,
//  faellt es in einem fremden Baum und sieht dort wie ein neuer Fehler aus.
//  ⚠️ Wer das hier liest und die Erweiterung "eben schnell" nachzieht, macht genau den Fehler,
//  gegen den der Waechter steht: eine Aenderung mit Reichweite, die niemand bestellt hat.
//  Nicht bauen, bis Corwis entschieden hat. Bis dahin gilt die Zahl oben als offener Befund,
//  nicht als Zustand, mit dem man sich abgefunden hat.
//
//  AUSNAHMEN STEHEN IM BAULOG (seit 2026-08-22)
//  ════════════════════════════════════════════
//  Der Task druckt die ganze Ausgabe des Skripts ueber `logger.lifecycle`. Darin steht seit dem
//  2026-08-22 je angewandter Ausnahme eine Zeile `UNTERDRUECKT <KENNUNG> <pfad>` samt
//  Begruendung, und die Schlusszeile nennt die Zahl der unterdrueckten Funde.
//  ⚠️ Vorher verwarf das Skript einen ausgenommenen Fund lautlos und meldete danach "keine
//  Funde": ein gruener Bau mit unterdruecktem Fund war von einem gruenen Bau ohne NICHT zu
//  unterscheiden. Der Bau bleibt gruen — das ist der Sinn einer Ausnahme —, aber er schweigt
//  nicht mehr darueber.
//  ⚠️ Neu ist auch Rueckgabe 4 (unten). Sie faellt, wenn eine Ausnahme NICHTS mehr unterdrueckt.
//
//  ⚠️ Die if/throw-Kombination ist keine Umstaendlichkeit. Ein blosses
//  `if (waechter.isFile()) apply from: waechter` verschwindet lautlos, sobald jemand die Datei
//  umbenennt — ein Waechter, der bei einem Tippfehler still aussetzt, ist kein Waechter
//  (Standing Rule 16). Fehlt der ganze Geschwister-Checkout, ist das etwas anderes und darf
//  durchgehen: dann baut jemand ohne den Stack.
//
//
//  WARUM DIESE DATEI IN zanoria-common LIEGT UND NICHT JE REPO
//  ══════════════════════════════════════════════════════════
//  Am 2026-08-21 am Bestand erhoben: die Plugin-Repos teilen KEINE Bau-Infrastruktur. Es gibt
//  kein buildSrc, keine Convention-Plugins, kein gemeinsames Wurzelprojekt. Verbunden sind sie
//  ausschliesslich ueber `includeBuild('../Geschwister')` mit dependencySubstitution — und die
//  Richtung ist je Repo verschieden (Nexus→ZanLang+zanoria-common; HeavyCrown/NexusStrike/
//  RelicWars→ZanoriaGame+Nexus+ZanLang; Showdown/ZanoriaLobby/ZanoriaCommands→nichts).
//
//  ⚠️ Und `includeBuild` traegt einen Waechter NICHT. Ein zusammengesetzter Bau fuehrt vom
//  eingebundenen Bau nur die Tasks aus, die zum Erzeugen des ersetzten Artefakts noetig sind —
//  praktisch `jar`. Ein `check` im Nachbarn laeuft nie mit. Ein Waechter in zanoria-common als
//  TASK waere damit unerreichbar; als SKRIPT, das der Verbraucher anwendet, laeuft er in dessen
//  eigenem Bau. Das ist der ganze Unterschied.
//
//  Die dritte Moeglichkeit — ein veroeffentlichtes Gradle-Plugin aus mavenLocal — ist
//  ausdruecklich verworfen: Standing Rule 17 beschreibt genau den Schaden. Ein Artefakt mit
//  gleichem Namen kann Wochen alt sein, der Bau bleibt gruen, und der Waechter prueft eine
//  Fassung, die niemand mehr liest. Ein Dateipfad kann nicht veralten.
//
//  DER PREIS, offen benannt
//  ────────────────────────
//  * Die Repos muessen Geschwister sein. Das setzt der Stack ohnehin ueberall voraus
//    (`file('../ZanLang').isDirectory()` steht in acht settings.gradle).
//  * Fehlt zanoria-common ganz, faellt der Waechter weg. Ein CI-Lauf, der ihn haben will, muss
//    zanoria-common mit auschecken — dieselbe Auflage, die fuer ZanoriaGame schon gilt.
//  * Er braucht Python 3 auf dem Bauwirt. Der Stack setzt das an anderer Stelle bereits voraus
//    (Zanoria-Docs/analysis/*.py). Fehlt es, bricht der Task ab — er faellt NICHT auf gruen
//    zurueck.
// ═══════════════════════════════════════════════════════════════════════════════════════════

def waechterSkript = file("${project.rootDir}/../zanoria-common/tools/befehlswaechter.py")

// ⚠️ Absoluter Pfad, nie ein relativer. Standing Rule 16 nennt vier Vorfaelle, in denen ein
// relativer Aufruf ins Leere lief und der Lauf trotzdem gruen meldete.
def waechterPfad = waechterSkript.absolutePath

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  DER BELEG — laeuft hier, weil hier die Baeufe sind
//  ═════════════════════════════════════════════════
//  Dieser Waechter prueft fremden Befehlscode. Wer prueft IHN? Die Gegenprobe in
//  ``zanoria-common/gradle/waechter-gegenprobe.gradle`` — aber die haengt am ``check`` von
//  zanoria-common, und das ist fast nie der Bau, der gerade laeuft.
//
//  ⚠️ Am 2026-08-22 an ``~/.gradle/daemon/*/*.log`` gemessen (Zeile "Received command: Build"),
//  Fenster 2026-08-02 bis 2026-08-21:
//      zanoria-common (Gradle 8.13)                20 Baeufe an  4 von 20 Tagen
//      die Verbraucher (8.8 / 8.14 / 8.14.3)     5248 Baeufe an 19 von 20 Tagen
//  262 zu 1. Und die CI faengt es nicht: alle elf Repos standen an dem Tag VOR ihrem origin,
//  letzter gepushter Stand 2026-07-24. Wer den Waechter aendert und danach nur Verbraucher
//  baut, saehe ohne die Pruefung unten neun gruene Laeufe ueber einem unbelegten Waechter.
//
//  Deshalb vergleicht JEDER Verbraucher-Bau den Fingerabdruck des Waechters gegen
//  ``tools/befehlswaechter.beleg``, den ``:waechterBeleg`` nur nach bestandener Gegenprobe UND
//  bestandenem Selbsttest schreibt. Kosten: ein SHA-256 ueber 68 kB, kein Unterprozess.
//
//  ⚠️ Das ist NICHT die verworfene achtfache Anbindung der Gegenprobe selbst. Die faellt auch
//  aus Gruenden, die kein Verbraucher beheben kann. Diese Pruefung hat genau eine Ursache und
//  genau eine Behebung, und beide stehen in der Meldung.
//
//  ⚠️ Die Fingerabdruck-Bildung steht zeichengleich auch in ``waechter-gegenprobe.gradle``.
//  Driften die beiden, passt kein Beleg mehr und alle neun Verbraucher fallen sofort und laut —
//  eine stille Drift ist ausgeschlossen. Nur unter dieser Bedingung ist die Doppelung besser
//  als ein drittes ``apply from:``, das bei einem Tippfehler still aussetzen koennte.
// ═══════════════════════════════════════════════════════════════════════════════════════════

// ⚠️ Zeilenenden normalisiert: ohne das haette derselbe Waechter unter Windows-Checkout mit
// autocrlf einen anderen Fingerabdruck als unter Linux-CI, und der Beleg waere ein
// Zufallsgenerator, der neun Repos grundlos roetet.
def waechterFingerabdruck = { File datei ->
    def roh = datei.getText("UTF-8").replace("\r\n", "\n").replace("\r", "\n")
    return java.security.MessageDigest.getInstance("SHA-256")
            .digest(roh.getBytes("UTF-8")).encodeHex().toString()
}

tasks.register("befehlswaechterBeleg") {
    group = "verification"
    description = "Prueft, dass der angewandte Befehlswaechter der ist, den die Gegenprobe in" +
                  " zanoria-common zuletzt belegt hat."

    // ⚠️ Kein UP-TO-DATE, aus demselben Grund wie beim Waechter selbst.
    outputs.upToDateWhen { false }

    doLast {
        if (!waechterSkript.isFile()) {
            throw new GradleException(
                "Befehlswaechter-Beleg: ${waechterPfad} fehlt. Kein Urteil ist nicht gruen.")
        }
        def belegDatei = new File(waechterSkript.parentFile, "befehlswaechter.beleg")
        if (!belegDatei.isFile()) {
            throw new GradleException(
                "Befehlswaechter-Beleg: ${belegDatei} fehlt. Dieser Bau wendet einen Waechter" +
                " an, von dem nichts belegt, dass seine Proben ueberhaupt noch pruefen —" +
                " verrutscht dort eine Regex, meldet er in allen neun Repos 'keine Funde' und" +
                " Rueckgabe 0. Behebung: in zanoria-common einmal `./gradlew check` fahren," +
                " dann liegt der Beleg.")
        }
        def erwartet = belegDatei.readLines("UTF-8").find { !it.trim().isEmpty() }?.trim()
        if (erwartet == null || !(erwartet ==~ /[0-9a-f]{64}/)) {
            throw new GradleException(
                "Befehlswaechter-Beleg: ${belegDatei} enthaelt in der ersten nichtleeren Zeile" +
                " keinen SHA-256 (gelesen: ${erwartet}). Ein unlesbarer Beleg ist kein Beleg;" +
                " er darf nicht wie ein bestandener aussehen. Behebung: in zanoria-common" +
                " `./gradlew check` fahren, die Datei wird dabei neu geschrieben.")
        }
        def gemessen = waechterFingerabdruck(waechterSkript)
        if (gemessen != erwartet) {
            throw new GradleException(
                "Befehlswaechter-Beleg: der angewandte Waechter ist NICHT der belegte.\n" +
                "  Beleg (zuletzt gegengeprueft): ${erwartet}\n" +
                "  ${waechterPfad}: ${gemessen}\n" +
                "⚠️ SCHADEN: dieser Bau prueft Befehlscode mit einem Waechter, den seit seiner" +
                " letzten Aenderung nichts geprueft hat. Faellt dabei eine Probe aus, sagt das" +
                " KEIN Log — der Waechter meldet 'keine Funde' und Rueckgabe 0, in allen neun" +
                " angebundenen Repos zugleich.\n" +
                "BEHEBUNG: in zanoria-common `./gradlew check` fahren. Das faehrt Gegenprobe" +
                " und Selbsttest gegen den geaenderten Waechter und schreibt den Beleg neu." +
                " Faellt dabei etwas, war die Aenderung der Fehler — nicht diese Meldung.\n" +
                "⚠️ Beleg und Waechter gehoeren in DENSELBEN Commit.")
        }
        logger.lifecycle("Befehlswaechter-Beleg: belegter Stand (${gemessen}).")
    }
}

tasks.register("befehlswaechter") {
    group = "verification"
    description = "Faengt Befehle, die deklariert oder implementiert sind und niemand anmeldet."

    // ⚠️ VOR dem Waechter, nicht daneben. Laeuft der Waechter zuerst und meldet "keine Funde",
    // hat der Leser die Gruenmeldung schon gesehen, bevor die Warnung kommt, dass sie nichts
    // wert ist.
    dependsOn "befehlswaechterBeleg"

    // ⚠️ Kein `inputs`/`outputs` und ausdruecklich kein UP-TO-DATE. Standing Rule 16, Nachtrag
    // 2026-08-07: `BUILD SUCCESSFUL > Task :x UP-TO-DATE` ist die teuerste Gruenmeldung im
    // Haus — der Rueckgabecode war 0 und das Werkzeug lief nicht. Dieser Task ist billig
    // (Sekundenbruchteile ueber ein paar hundert Dateien); er laeuft lieber immer.
    outputs.upToDateWhen { false }

    doLast {
        if (!waechterSkript.isFile()) {
            throw new GradleException(
                "Befehlswaechter: ${waechterPfad} fehlt. Kein Urteil ist nicht gruen.")
        }

        // ⚠️ Der Interpreter wird gesucht, nicht geraten — und wenn keiner antwortet, BRICHT es
        // ab. Standing Rule 28: `shell=true` startete unter Windows cmd.exe, der Lauf fand nie
        // statt, und die Auswertung las die Berichte des vorigen Laufs. Hier gibt es keine
        // alten Berichte, aber dieselbe Falle: ein fehlender Interpreter darf nicht wie ein
        // bestandener Lauf aussehen.
        def kandidaten = System.getProperty("os.name").toLowerCase().contains("win")
                ? ["py", "python", "python3"]
                : ["python3", "python"]
        def interpreter = null
        for (k in kandidaten) {
            try {
                def probe = new ByteArrayOutputStream()
                def r = project.exec {
                    commandLine k, "--version"
                    standardOutput = probe
                    errorOutput = probe
                    ignoreExitValue = true
                }
                if (r.exitValue == 0) { interpreter = k; break }
            } catch (ignored) { /* naechster Kandidat */ }
        }
        if (interpreter == null) {
            throw new GradleException(
                "Befehlswaechter: kein Python 3 gefunden (versucht: ${kandidaten.join(', ')})." +
                " Der Waechter faellt NICHT auf gruen zurueck — ein Bau ohne Pruefung ist" +
                " keine bestandene Pruefung.")
        }

        def ausgabe = new ByteArrayOutputStream()
        def ergebnis = project.exec {
            commandLine interpreter, waechterPfad, project.rootDir.absolutePath
            standardOutput = ausgabe
            errorOutput = ausgabe
            ignoreExitValue = true
        }
        def text = ausgabe.toString("UTF-8")
        logger.lifecycle(text)

        // ⚠️ Der Rueckgabecode entscheidet, nicht der Text. Standing Rule 24: in einer Pipe
        // entscheidet der letzte Befehl, nicht der wichtige — hier wird der Wert getrennt
        // festgehalten und das Urteil daran gehaengt.
        switch (ergebnis.exitValue) {
            case 0:
                break
            case 1:
                throw new GradleException(
                    "Befehlswaechter: Funde vorhanden — siehe oben. Ein Befehl, der deklariert" +
                    " oder implementiert ist und den niemand anmeldet, faellt zur Laufzeit" +
                    " NICHT als 'Befehl fehlt' auf. Deshalb faellt er hier.")
            case 2:
                throw new GradleException(
                    "Befehlswaechter: NICHTS GEPRUEFT (Rueckgabe 2). Er hat keinen einzigen" +
                    " Plugin-Deskriptor gefunden. Das ist kein bestandener Lauf — entweder" +
                    " zeigt der Pfad falsch, oder die paper-plugin.yml liegt nicht unter" +
                    " src/*/resources/.")
            case 4:
                // ⚠️ Kein offener Fund, aber eine Ausnahme deckt nichts mehr. Die
                // .befehlswaechter-ausnahmen nennt sich selbst eine "Liste offener
                // Entscheidungen, kein Freibrief" — bis zum 2026-08-22 fuehrte das NICHTS aus.
                // Rot ist hier richtig, weil der Waechter den Beweis hat: die Datei ist weg
                // oder er hat sie gelesen und den Fund nicht bekommen. Die einzige richtige
                // Handlung ist das Loeschen der Zeile. Wo er den Beweis NICHT hat (Pfad in
                // einem Nachbarmodul, das er gar nicht liest), warnt er nur und faellt nicht —
                // sonst zwaenge er zum Loeschen einer Ausnahme, die vielleicht weiter deckt.
                throw new GradleException(
                    "Befehlswaechter: VERALTETE AUSNAHME (Rueckgabe 4) — siehe oben. Kein" +
                    " offener Fund, aber mindestens eine Zeile in .befehlswaechter-ausnahmen" +
                    " unterdrueckt nichts mehr. Eine solche Zeile behauptet eine offene" +
                    " Entscheidung, die keine ist, und deckt ab jetzt nur noch kuenftige" +
                    " Schuld an derselben Stelle. Zeile loeschen.")
            default:
                throw new GradleException(
                    "Befehlswaechter: unerwartete Rueckgabe ${ergebnis.exitValue}.")
        }
    }
}

// ⚠️ An `check` haengen, nicht an `build`. Damit greift er auch bei `./gradlew check` und bei
// jedem CI-Lauf, der test faehrt — und er haelt den Jar-Bau nicht auf, wenn jemand bewusst nur
// assemblen will.
tasks.matching { it.name == "check" }.configureEach {
    dependsOn "befehlswaechter"
}
