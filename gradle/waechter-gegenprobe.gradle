// ═══════════════════════════════════════════════════════════════════════════════════════════
//  Waechter-Gegenprobe — Gradle-Anbindung
//
//  Diese Datei haengt ``tools/waechter-gegenprobe.py`` an den ``check`` von zanoria-common.
//  Sie wird NUR hier angewendet, nicht in den neun Verbrauchern. Warum, steht unten.
//
//
//  WAS DIE GEGENPROBE IST — und warum sie ohne Anbindung wertlos war
//  ═════════════════════════════════════════════════════════════════
//  ``tools/befehlswaechter.py`` haengt ueber ``gradle/befehlswaechter.gradle`` in NEUN Repos.
//  Er prueft dort fremden Code. Wer prueft IHN?
//
//  ⚠️ Bis zum 2026-08-22: niemand. Die Gegenprobe lag als Skript daneben und WURDE VON NICHTS
//  GERUFEN. Sie ist der einzige Beleg, dass die fuenf Proben im Waechter ueberhaupt etwas
//  pruefen — und genau dieser Beleg wurde nie erbracht.
//  ⚠️ SCHADEN, konkret: verrutscht in einer Probe die Regex oder kippt eine Bedingung, meldet
//  der Waechter in allen neun Repos "keine Funde" und Rueckgabe 0. Neun gruene Baeume ueber
//  einer Pruefung, die nichts mehr prueft. Kein Log, keine Warnung, kein Unterschied — das ist
//  dieselbe Bauart Fehler, gegen die der Waechter selbst steht.
//
//  Die Gegenprobe macht je Probe drei Schritte: GIFT (ein Wegwerfbaum, der die Probe ausloesen
//  MUSS), MUTANT (dieselbe Probe im Waechter entfernt — die Meldung MUSS verschwinden), ZEUGE
//  (das Original ist byteweise unveraendert). Der MUTANT ist der Punkt: eine Probe, deren
//  Entfernung nichts aendert, hat den Fund nicht selbst gemacht.
//
//
//  WARUM ZENTRAL AN zanoria-common UND NICHT JE VERBRAUCHER
//  ═══════════════════════════════════════════════════════
//  Die Abwaegung, offen, mit ihren Kosten:
//
//  FUER zentral
//   * SCHICHT. Der Waechter prueft den Code des VERBRAUCHERS — er gehoert in dessen Bau. Die
//     Gegenprobe prueft den Code von zanoria-common — sie gehoert in DESSEN Bau. Ein roter
//     NexusStrike-Lauf wegen einer verrutschten Regex in einem zehnten Repo schickt den, der
//     ihn debuggt, in den falschen Baum. Genau davor warnt ``befehlswaechter.gradle`` schon in
//     eigener Sache ("faellt es in einem fremden Baum und sieht dort wie ein neuer Fehler aus").
//   * Der Gegenstand aendert sich nur hier. Die Gegenprobe misst eine Eigenschaft von
//     ``tools/befehlswaechter.py``. Diese Datei aendert sich, wenn zanoria-common sich aendert —
//     nicht, wenn NexusStrike sich aendert. Neunmal je Commit dasselbe Invariant messen ist
//     nicht sparsam, sondern schlicht am falschen Ausloeser.
//   * ⚠️ ZURUECKGEZOGEN am 2026-08-22 — hier stand "ES LAEUFT WIRKLICH, zanoria-common hat eine
//     CI (``.github/workflows/ci.yml``, push auf main + jeder PR)". Die Datei gibt es, der
//     Ausloeser ist der Push, und GEPUSHT WIRD NICHT: an dem Tag stand jedes der elf Repos vor
//     seinem ``origin`` (zanoria-common 12 Commits, Nexus 80, NexusService 26, CoreClash 19,
//     ZanoriaGame 14 ...), letzter gepushter Stand 2026-07-24. Ein Ausloeser, den niemand
//     ausloest, ist genau die Bauart Zusicherung, gegen die dieses ganze Bauwerk steht — und er
//     hat hier eine Entscheidung getragen. Was von dem Punkt bleibt: von den neun Verbrauchern
//     haben nur vier ueberhaupt eine CI-Datei (Nexus, RelicWars, CoreClash, ZanoriaGame). Das ist ein
//     Argument gegen die Anbindung je Verbraucher, aber KEINES fuer die Wirksamkeit dieser hier.
//   * Eine Aenderung an ``befehlswaechter.gradle`` trifft alle neun zugleich. Diese hier trifft
//     ein Repo.
//
//  GEGEN zentral — der Preis, benannt statt weggelassen
//   * ⚠️ Sie laeuft nur, wenn jemand zanoria-common baut. Wer ``tools/befehlswaechter.py``
//     oertlich aendert und danach nur die Verbraucher baut, bekommt neun gruene Laeufe und keine
//     Gegenprobe. Am 2026-08-22 gemessen, wie oft das der Fall ist: 262 Verbraucher-Baeufe je
//     zanoria-common-Bau (Zahlen unten unter DER BELEG). Der Preis war also nicht klein,
//     sondern der Regelfall.
//   * ⚠️ Hier stand: "Das schliesst kein Task und kein Kommentar. Es ist eine Arbeitsweise."
//     Das war die Kapitulation. GESCHLOSSEN am 2026-08-22 durch ``:waechterBeleg`` unten und
//     ``:befehlswaechterBeleg`` in ``befehlswaechter.gradle``: nicht die Gegenprobe laeuft jetzt
//     in den neun Verbrauchern, sondern die Frage, OB sie fuer den dort angewandten Waechter je
//     gelaufen ist. Die Arbeitsweise ist damit eine Maschine.
//
//  VERWORFEN: je Verbraucher zusaetzlich. Das haette den Preis oben bezahlt, aber neun Repos an
//  ein Ergebnis gehaengt, das keiner von ihnen beeinflussen kann. Zusaetzlich faellt die
//  Gegenprobe absichtlich auch dann rot, wenn ihr Mutationsanker im Waechter nicht mehr steht
//  ("NICHT GELAUFEN") — ein sauberer Umbau des Waechters wuerde damit neun fremde Baeume roeten,
//  bevor irgendwer den Anker nachzieht.
//
//
//  ⚠️ WAS DIE GEGENPROBE DECKT — am 2026-08-22 gemessen, nicht geschaetzt
//  ═══════════════════════════════════════════════════════════════════════
//  Gemessen wird mit ``tools/mutationskatalog.py``: 22 Beschaedigungen einzeln in den Waechter
//  gesetzt, danach je Gegenprobe UND Selbsttest gegen den beschaedigten Waechter. Rot heisst
//  gefangen, gruen heisst STILL — und still heisst: neun Repos bauen weiter gruen ueber einer
//  Pruefung, die an dieser Stelle nichts mehr prueft.
//
//    VORHER  (Stand des Vormittags)   11 gefangen, 11 STILL
//    NACHHER (nach der Reparatur)     22 gefangen,  0 STILL
//
//  Die elf stillen waren drei Bauarten, und alle drei sind geschlossen:
//    * KEINE GEGENRICHTUNG. ``gift_ok`` verlangte nur ``rc==1`` und dass die Kennung irgendwo
//      in der Ausgabe steht — zusaetzliche Falschfunde fielen nicht auf, Ueber-Meldung war
//      unsichtbar. Jetzt prueft jeder Giftbaum die GENAUE Kennungsmenge und die GENAUE
//      Fundzahl, und es gibt einen SAUBEREN Baum (Abschnitt 2), auf dem jeder Fund ein
//      Falschfund ist. Sieben "zu strenge" Mutanten (Abschnitt 3) muessen ihn roeten.
//    * NUR GANZE TOETUNGEN. Jede Alternative jeder Probe hat jetzt ihren eigenen Giftbaum:
//      D ueber onCommand UND ueber onTabComplete, E ueber alle vier Schnittstellen und ueber
//      ``record``, C ueber beide getCommand-Regexe mit Umbruch vor der Klammer.
//    * DIE MASCHINERIE war Prosa. Ausnahme ohne Begruendung, Dublette, und — am schwersten —
//      die Stillegarantie selbst.
//
//  ⚠️ Die Stillegarantie ist der teuerste Fall und deshalb hier ausdruecklich: wurde
//  ``return 2`` ("NICHTS GEPRUEFT") zu ``return 0``, blieben Gegenprobe UND Selbsttest gruen,
//  waehrend alle neun Repos einen BESTANDENEN Lauf ueber NULL gesehene Deskriptoren melden.
//  Sie ist jetzt vierfach: kein Deskriptor, Wurzel ohne Deskriptor, keine Java-Datei, Modul
//  ohne Quellen. Und ihr Giftbaum prueft die RUECKGABE, nicht den Text — der Mutant druckt die
//  Warnung naemlich weiter und aendert nur das Urteil.
//
//  ⚠️ WAS SIE WEITERHIN NICHT DECKT
//    * Die Lage ``UNGEPRUEFT`` einer veralteten Ausnahme — sie braucht einen Baum mit einem
//      Modul OHNE Deskriptor und ist von ``--selbsttest`` gedeckt, nicht von hier.
//    * Sie misst den Waechter gegen WEGWERFBAEUME, nicht gegen den Bestand. Dass er in ZanUI
//      nur 9 von 49 Java-Dateien sieht, sagt keine dieser Pruefungen — das steht als offener
//      Befund in ``befehlswaechter.gradle``.
//    * Der Katalog haengt NICHT an ``check`` (22 volle Laeufe, einige hundert Unterprozesse).
//      Er gehoert vor und nach eine Aenderung am Waechter, von Hand. Ein Kommentar ist kein
//      Aufruf — deshalb steht das hier als offener Befund und nicht als Zusicherung.
// ═══════════════════════════════════════════════════════════════════════════════════════════

def gegenprobeSkript = file("${project.rootDir}/tools/waechter-gegenprobe.py")

// ⚠️ Absoluter Pfad, nie ein relativer. Standing Rule 16: ein relativer Aufruf lief ins Leere
// und der Lauf meldete trotzdem gruen.
def gegenprobePfad = gegenprobeSkript.absolutePath

tasks.register("waechterGegenprobe") {
    group = "verification"
    description = "Belegt beide Richtungen des Befehlswaechters: Giftbaum + Mutant + Zeuge je" +
                  " Alternative, dazu ein sauberer Baum, auf dem jeder Fund ein Falschfund ist."

    // ⚠️ Kein `inputs`/`outputs`, ausdruecklich kein UP-TO-DATE. `Task :x UP-TO-DATE` ist eine
    // Gruenmeldung ueber einen Lauf, der nicht stattgefunden hat — und dieser Task existiert
    // ausschliesslich dagegen. Er kostet wenige Sekunden; er laeuft lieber immer.
    outputs.upToDateWhen { false }

    doLast {
        if (!gegenprobeSkript.isFile()) {
            throw new GradleException(
                "Waechter-Gegenprobe: ${gegenprobePfad} fehlt. Der Befehlswaechter haengt in neun" +
                " Repos und waere damit wieder unbelegt. Kein Urteil ist nicht gruen.")
        }
        def waechterSkript = file("${project.rootDir}/tools/befehlswaechter.py")
        if (!waechterSkript.isFile()) {
            throw new GradleException(
                "Waechter-Gegenprobe: ${waechterSkript} fehlt — der Gegenstand der Pruefung ist" +
                " weg. Neun Verbraucher wenden dieses Skript an; ohne es brechen sie.")
        }

        // ⚠️ Der Interpreter wird gesucht, nicht geraten, und wenn keiner antwortet, BRICHT es
        // ab. Ein fehlender Interpreter darf nicht aussehen wie ein bestandener Lauf.
        def kandidaten = System.getProperty("os.name").toLowerCase().contains("win")
                ? ["py", "python", "python3"]
                : ["python3", "python"]
        def interpreter = null
        for (k in kandidaten) {
            try {
                def probe = new ByteArrayOutputStream()
                def r = project.exec {
                    commandLine k, "--version"
                    standardOutput = probe
                    errorOutput = probe
                    ignoreExitValue = true
                }
                if (r.exitValue == 0) { interpreter = k; break }
            } catch (ignored) { /* naechster Kandidat */ }
        }
        if (interpreter == null) {
            throw new GradleException(
                "Waechter-Gegenprobe: kein Python 3 gefunden (versucht: ${kandidaten.join(', ')})." +
                " Sie faellt NICHT auf gruen zurueck — ein Bau ohne Pruefung ist keine" +
                " bestandene Pruefung.")
        }

        def ausgabe = new ByteArrayOutputStream()
        def ergebnis = project.exec {
            commandLine interpreter, gegenprobePfad
            standardOutput = ausgabe
            errorOutput = ausgabe
            ignoreExitValue = true
        }
        logger.lifecycle(ausgabe.toString("UTF-8"))

        // ⚠️ Der Rueckgabecode entscheidet, nicht der Text. In einer Pipe entscheidet der letzte
        // Befehl, nicht der wichtige — hier wird der Wert getrennt festgehalten.
        switch (ergebnis.exitValue) {
            case 0:
                break
            case 1:
                throw new GradleException(
                    "Waechter-Gegenprobe: mindestens eine Probe des Befehlswaechters ist" +
                    " GEFALLEN — siehe oben. Entweder schlaegt sie auf ihrem Giftbaum nicht mehr" +
                    " an (dann ist sie blind und neun Repos bauen gruen ueber ungesehenem" +
                    " Befehlscode), oder ihre Entfernung aendert nichts (dann kam der Fund von" +
                    " woanders und die Zeile ist Deko), oder ihr Mutationsanker steht nicht mehr" +
                    " im Waechter (dann gibt es kein Urteil, und kein Urteil ist nicht gruen).")
            case 2:
                throw new GradleException(
                    "Waechter-Gegenprobe: ES LIEF NICHTS (Rueckgabe 2). Keine einzige Mutation" +
                    " wurde ausgefuehrt. Das ist kein bestandener Lauf, sondern eine Gegenprobe," +
                    " die nichts gegengeprueft hat.")
            default:
                throw new GradleException(
                    "Waechter-Gegenprobe: unerwartete Rueckgabe ${ergebnis.exitValue}.")
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  DER SELBSTTEST — bis zum 2026-08-22 rief ihn NIEMAND
//  ════════════════════════════════════════════════════
//  ⚠️ Der Kommentar weiter oben verlaesst sich an zwei Stellen woertlich darauf, dass
//  ``befehlswaechter.py --selbsttest`` etwas faengt ("Den Kommentarfall faengt wenigstens
//  ``befehlswaechter.py --selbsttest``"). Nur lief er in keinem Bau. Ein Werkzeug, das niemand
//  ruft, belegt nichts, egal was es koennte — dieselbe Feststellung steht im Kopf der
//  Gegenprobe ueber sie selbst, und sie galt danebenstehend weiter fuer den Selbsttest.
//  ⚠️ SCHADEN konkret: der Selbsttest deckt Faelle, die die Gegenprobe ausdruecklich NICHT
//  deckt — die Gegenrichtung (ein sauberes Plugin muss gruen sein), den Kommentarfall, und seit
//  dem 2026-08-22 die Ausnahmen in allen drei Lagen (WEG, GEGENSTANDSLOS, UNGEPRUEFT). Wer sie
//  hinzufuegt, ohne den Selbsttest anzubinden, schreibt eine Pflicht in Prosa und keine
//  Maschine.
// ═══════════════════════════════════════════════════════════════════════════════════════════

tasks.register("waechterSelbsttest") {
    group = "verification"
    description = "Laesst den Befehlswaechter gegen seine eigenen Wegwerfbaeume laufen" +
                  " (beide Richtungen, Kommentarfall, Ausnahmen)."

    // ⚠️ Dieselbe Begruendung wie oben: kein UP-TO-DATE. Ein Selbsttest, den Gradle
    // wegoptimiert, ist eine Gruenmeldung ueber einen Lauf, der nicht stattgefunden hat.
    outputs.upToDateWhen { false }

    doLast {
        def waechterSkript = file("${project.rootDir}/tools/befehlswaechter.py")
        if (!waechterSkript.isFile()) {
            throw new GradleException(
                "Waechter-Selbsttest: ${waechterSkript} fehlt. Neun Verbraucher wenden dieses" +
                " Skript an; kein Urteil ist nicht gruen.")
        }

        def kandidaten = System.getProperty("os.name").toLowerCase().contains("win")
                ? ["py", "python", "python3"]
                : ["python3", "python"]
        def interpreter = null
        for (k in kandidaten) {
            try {
                def probe = new ByteArrayOutputStream()
                def r = project.exec {
                    commandLine k, "--version"
                    standardOutput = probe
                    errorOutput = probe
                    ignoreExitValue = true
                }
                if (r.exitValue == 0) { interpreter = k; break }
            } catch (ignored) { /* naechster Kandidat */ }
        }
        if (interpreter == null) {
            throw new GradleException(
                "Waechter-Selbsttest: kein Python 3 gefunden (versucht:" +
                " ${kandidaten.join(', ')}). Er faellt NICHT auf gruen zurueck.")
        }

        def ausgabe = new ByteArrayOutputStream()
        def ergebnis = project.exec {
            commandLine interpreter, waechterSkript.absolutePath, "--selbsttest"
            standardOutput = ausgabe
            errorOutput = ausgabe
            ignoreExitValue = true
        }
        def text = ausgabe.toString("UTF-8")
        logger.lifecycle(text)

        // ⚠️ Der Rueckgabecode entscheidet. Zusaetzlich muss die Schlusszeile ueberhaupt da
        // sein: ein Skript, das vorher abstuerzt, kann jeden Code liefern, und "0 von 0
        // bestanden" waere kein bestandener Lauf, sondern gar keiner.
        if (!text.contains("Selbsttest:")) {
            throw new GradleException(
                "Waechter-Selbsttest: keine Schlusszeile 'Selbsttest: N von M bestanden' in der" +
                " Ausgabe. Der Lauf ist abgebrochen, bevor er ein Urteil hatte.")
        }
        if (ergebnis.exitValue != 0) {
            throw new GradleException(
                "Waechter-Selbsttest: mindestens ein Fall GEFALLEN (Rueckgabe" +
                " ${ergebnis.exitValue}) — siehe oben. Der Waechter haengt in neun Repos;" +
                " faellt hier die Gegenrichtung, schwaerzt er dort Sauberes an, und faellt eine" +
                " Probe, baut dort etwas gruen ueber ungesehenem Befehlscode.")
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  DER BELEG — der zweite Ausloeser, weil der erste fast nie feuert
//  ═══════════════════════════════════════════════════════════════
//  ⚠️ Am 2026-08-22 an den Gradle-Daemon-Protokollen gemessen (``~/.gradle/daemon/*/*.log``,
//  Zeile "Received command: Build"), Fenster 2026-08-02 bis 2026-08-21, der heutige Tag
//  ausgenommen weil ihn die Arbeit am Waechter selbst verfaelscht:
//
//      zanoria-common (eigener Wrapper, Gradle 8.13)        20 Baeufe an  4 von 20 Tagen
//      die Verbraucher (Gradle 8.8 / 8.14 / 8.14.3)       5248 Baeufe an 19 von 20 Tagen
//
//  Das sind 262 Verbraucher-Baeufe je zanoria-common-Bau. Die Gegenprobe oben haengt am
//  ``check`` DIESES Repos — sie feuert damit in rund 0,4 % der Baeufe dieser Familie.
//  ⚠️ Und die CI faengt es NICHT: am 2026-08-22 stand jedes der elf Repos VOR seinem
//  ``origin`` (zanoria-common 12 Commits, Nexus 80, NexusService 26 ...), der letzte gepushte
//  Stand war der 2026-07-24. Ein Arbeitsablauf ohne Push hat keine CI, egal was in
//  ``.github/workflows/ci.yml`` steht. Der Satz "ES LAEUFT WIRKLICH" weiter oben war zum
//  Zeitpunkt, an dem er geschrieben wurde, bereits vier Wochen falsch.
//
//  DIE FOLGE, unbeschoenigt: wer ``tools/befehlswaechter.py`` aendert und danach nur die
//  Verbraucher baut — der statistisch weit haeufigere Fall —, bekommt neun gruene Laeufe ueber
//  einem Waechter, den nichts belegt hat. Genau die Lage, gegen die die Gegenprobe steht.
//
//  WAS DER BELEG MACHT
//  ───────────────────
//  Nach bestandener Gegenprobe UND bestandenem Selbsttest schreibt dieser Task den
//  Fingerabdruck des geprueften Waechters nach ``tools/befehlswaechter.beleg``.
//  ``befehlswaechter.gradle`` — angewendet in ALLEN neun Verbrauchern — bildet denselben
//  Fingerabdruck und vergleicht. Weicht er ab, faellt der Verbraucher-Bau.
//
//  ⚠️ Damit ist der Ausloeser dort, wo die Baeufe sind, OHNE die Gegenprobe neunfach zu fahren.
//  Der Verbraucher rechnet einen SHA-256 ueber 68 kB — Bruchteile einer Millisekunde, kein
//  Unterprozess, keine 22 Mutanten.
//
//  ⚠️ WARUM DAS ETWAS ANDERES IST ALS DIE VERWORFENE NEUNFACHE ANBINDUNG (Absatz oben):
//  Verworfen wurde, die Verbraucher an das ERGEBNIS der Gegenprobe zu haengen — die faellt auch
//  aus Gruenden, die kein Verbraucher beeinflussen kann (fehlender Mutationsanker, kein Python,
//  ein halb umgebauter Waechter), und schickt den, der sie debuggt, in den falschen Baum. Der
//  Beleg hat genau EINE Ursache und genau EINE Behebung, und beide stehen in der Fehlermeldung:
//  der Waechter wurde geaendert, ohne dass ihn jemand belegt hat -> ``check`` in zanoria-common
//  fahren. Das ist kein fremder Fehler im falschen Baum, sondern der eigene Zustand des
//  Werkzeugs, das dieser Bau gerade benutzt.
//
//  ⚠️ DER PREIS, benannt statt weggelassen: wer den Waechter umbaut, roetet damit alle neun
//  Verbraucher, bis er einmal ``check`` in zanoria-common faehrt. Das ist gewollt — waehrend
//  dieser Zeit laeuft dort ein unbelegter Waechter —, aber es ist eine echte Unterbrechung
//  mitten in einer Aenderung, kein kostenloser Zusatz.
//
//  ⚠️ DIE DOPPELUNG: die Fingerabdruck-Bildung steht zweimal, hier und in
//  ``befehlswaechter.gradle``. Das ist Absicht — ein drittes ``apply from:`` waere eine weitere
//  Stelle, die bei einem Tippfehler still aussetzt. Driften die beiden auseinander, passt kein
//  Beleg mehr und alle neun Verbraucher fallen SOFORT und LAUT. Eine stille Drift ist hier
//  nicht moeglich; das ist die Bedingung, unter der die Doppelung vertretbar ist.
//
//  ⚠️ Der Beleg gehoert MIT dem Waechter in denselben Commit. Ein gepushter Waechter ohne
//  passenden Beleg roetet jeden frischen Checkout.
//
//  ⚠️ AUCH VERWORFEN, und zwar an der Messung: den ``check`` des eingebundenen Baus per
//  ``gradle.includedBuild('zanoria-common').task(':check')`` an den ``check`` des Verbrauchers
//  haengen. Am 2026-08-22 mit einem Wegwerf-Init-Skript gegen Nexus geprueft — es GEHT: der
//  Lauf zog ``:zanoria-common:test``, ``:waechterGegenprobe``, ``:waechterSelbsttest``,
//  ``:waechterBeleg`` und ``:zanoria-common:check`` mit. Nur traegt es fast niemanden. Von den
//  NEUN Repos, die ``befehlswaechter.gradle`` anwenden, bindet genau EINES zanoria-common
//  ueberhaupt als Bau ein:
//      Nexus            includeBuild('../ZanLang'), includeBuild('../zanoria-common')  <-- eines
//      CoreClash        ../ZanoriaGame, ../ZanLang
//      NexusStrike      ../ZanoriaGame, ../Nexus, ../ZanLang
//      RelicWars        ../ZanoriaGame, ../Nexus, ../ZanLang
//      Showdown         ../ZanoriaGame
//      ZanoriaGame      ../ZanLang
//      ZanUI            ../ZanLang
//      ZanoriaCommands  (keines)
//      ZanoriaLobby     (keines)
//  Ein Weg, der 1 von 9 deckt, ist keine Anbindung, sondern eine Ausnahme. Der Beleg deckt 9
//  von 9, weil er im Waechter-Skript selbst sitzt, das alle neun ohnehin anwenden.
//  ⚠️ Ohne diese Anbindung fuehrt ein Verbraucher-Bau vom eingebundenen Bau nur das aus, was
//  fuer das ersetzte Artefakt noetig ist. Am selben Tag mit ``./gradlew check --dry-run`` in
//  Nexus gemessen: ``:zanoria-common:compileJava``, ``:processResources``, ``:classes``,
//  ``:jar`` — kein ``:test``, kein ``:check``. Die Behauptung weiter unten in
//  ``befehlswaechter.gradle`` stimmt also, sie ist jetzt auch belegt.
// ═══════════════════════════════════════════════════════════════════════════════════════════

// ⚠️ Zeilenenden normalisiert. Ohne das haette derselbe Waechter unter Windows-Checkout mit
// autocrlf einen anderen Fingerabdruck als unter Linux-CI, und der Beleg waere ein
// Zufallsgenerator. Dieselbe Normalisierung steht in `befehlswaechter.gradle` — beide muessen
// zeichengleich bleiben.
def waechterFingerabdruck = { File datei ->
    def roh = datei.getText("UTF-8").replace("\r\n", "\n").replace("\r", "\n")
    return java.security.MessageDigest.getInstance("SHA-256")
            .digest(roh.getBytes("UTF-8")).encodeHex().toString()
}

tasks.register("waechterBeleg") {
    group = "verification"
    description = "Schreibt den Fingerabdruck des belegten Befehlswaechters nach" +
                  " tools/befehlswaechter.beleg — die neun Verbraucher pruefen ihn."

    // ⚠️ Kein UP-TO-DATE. Derselbe Grund wie oben, und ein zusaetzlicher: dieser Task darf nur
    // dann schreiben, wenn die beiden Pruefungen in DIESEM Lauf wirklich gelaufen sind.
    outputs.upToDateWhen { false }

    // ⚠️ dependsOn, nicht mustRunAfter. mustRunAfter ordnet nur, wenn beide ohnehin laufen — ein
    // `./gradlew waechterBeleg` allein wuerde sonst einen Beleg ueber einen ungeprueften
    // Waechter schreiben. Genau die Bauart Fehler, gegen die der ganze Aufbau steht.
    dependsOn "waechterGegenprobe"
    dependsOn "waechterSelbsttest"

    doLast {
        def waechterSkript = file("${project.rootDir}/tools/befehlswaechter.py")
        if (!waechterSkript.isFile()) {
            throw new GradleException(
                "Waechter-Beleg: ${waechterSkript} fehlt. Ein Beleg ueber eine Datei, die es" +
                " nicht gibt, waere die teuerste Sorte gruen.")
        }
        def abdruck = waechterFingerabdruck(waechterSkript)
        def beleg = new File(waechterSkript.parentFile, "befehlswaechter.beleg")
        def vorher = beleg.isFile() ? beleg.readLines("UTF-8").find { !it.trim().isEmpty() } : null

        beleg.setText(
            abdruck + "\n" +
            "\n" +
            "# Fingerabdruck (SHA-256, Zeilenenden auf \\n normalisiert) von befehlswaechter.py,\n" +
            "# geschrieben von :waechterBeleg NACH bestandener Gegenprobe und bestandenem\n" +
            "# Selbsttest. Die erste nichtleere Zeile ist der Wert, alles Weitere ist Prosa.\n" +
            "#\n" +
            "# Die neun Verbraucher lesen ihn in gradle/befehlswaechter.gradle und fallen bei\n" +
            "# Abweichung. Grund: sie bauen 262-mal so oft wie zanoria-common (gemessen am\n" +
            "# 2026-08-22), und ohne diesen Vergleich liefe dort ein Waechter, den seit seiner\n" +
            "# letzten Aenderung nichts geprueft hat.\n" +
            "#\n" +
            "# ⚠️ NICHT VON HAND AENDERN. Wer hier den Wert eintippt, statt check zu fahren,\n" +
            "# stellt eine bestandene Gegenprobe aus, die nicht stattgefunden hat.\n",
            "UTF-8")

        if (vorher == null) {
            logger.lifecycle("Waechter-Beleg: neu angelegt (${abdruck}).")
        } else if (vorher != abdruck) {
            logger.lifecycle(
                "Waechter-Beleg: der Waechter hat sich geaendert und ist neu belegt.\n" +
                "  vorher:  ${vorher}\n" +
                "  jetzt:   ${abdruck}\n" +
                "⚠️ tools/befehlswaechter.beleg gehoert MIT tools/befehlswaechter.py in" +
                " denselben Commit — sonst roetet der naechste frische Checkout alle neun" +
                " Verbraucher.")
        } else {
            logger.lifecycle("Waechter-Beleg: unveraendert (${abdruck}).")
        }
    }
}

// ⚠️ An `check` haengen, nicht an `build`. `build` zieht `check` mit; umgekehrt nicht. Damit
// greift sie bei `./gradlew check`, bei `./gradlew build` und in der CI dieses Repos.
tasks.matching { it.name == "check" }.configureEach {
    dependsOn "waechterGegenprobe"
    dependsOn "waechterSelbsttest"
    dependsOn "waechterBeleg"
}
