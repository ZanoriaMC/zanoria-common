// ═══════════════════════════════════════════════════════════════════════════════════════════
//  Waechter-Gegenprobe — Gradle-Anbindung
//
//  Diese Datei haengt ``tools/waechter-gegenprobe.py`` an den ``check`` von zanoria-common.
//  Sie wird NUR hier angewendet, nicht in den acht Verbrauchern. Warum, steht unten.
//
//
//  WAS DIE GEGENPROBE IST — und warum sie ohne Anbindung wertlos war
//  ═════════════════════════════════════════════════════════════════
//  ``tools/befehlswaechter.py`` haengt ueber ``gradle/befehlswaechter.gradle`` in ACHT Repos.
//  Er prueft dort fremden Code. Wer prueft IHN?
//
//  ⚠️ Bis zum 2026-08-22: niemand. Die Gegenprobe lag als Skript daneben und WURDE VON NICHTS
//  GERUFEN. Sie ist der einzige Beleg, dass die fuenf Proben im Waechter ueberhaupt etwas
//  pruefen — und genau dieser Beleg wurde nie erbracht.
//  ⚠️ SCHADEN, konkret: verrutscht in einer Probe die Regex oder kippt eine Bedingung, meldet
//  der Waechter in allen acht Repos "keine Funde" und Rueckgabe 0. Acht gruene Baeume ueber
//  einer Pruefung, die nichts mehr prueft. Kein Log, keine Warnung, kein Unterschied — das ist
//  dieselbe Bauart Fehler, gegen die der Waechter selbst steht.
//
//  Die Gegenprobe macht je Probe drei Schritte: GIFT (ein Wegwerfbaum, der die Probe ausloesen
//  MUSS), MUTANT (dieselbe Probe im Waechter entfernt — die Meldung MUSS verschwinden), ZEUGE
//  (das Original ist byteweise unveraendert). Der MUTANT ist der Punkt: eine Probe, deren
//  Entfernung nichts aendert, hat den Fund nicht selbst gemacht.
//
//
//  WARUM ZENTRAL AN zanoria-common UND NICHT JE VERBRAUCHER
//  ═══════════════════════════════════════════════════════
//  Die Abwaegung, offen, mit ihren Kosten:
//
//  FUER zentral
//   * SCHICHT. Der Waechter prueft den Code des VERBRAUCHERS — er gehoert in dessen Bau. Die
//     Gegenprobe prueft den Code von zanoria-common — sie gehoert in DESSEN Bau. Ein roter
//     NexusStrike-Lauf wegen einer verrutschten Regex in einem neunten Repo schickt den, der
//     ihn debuggt, in den falschen Baum. Genau davor warnt ``befehlswaechter.gradle`` schon in
//     eigener Sache ("faellt es in einem fremden Baum und sieht dort wie ein neuer Fehler aus").
//   * Der Gegenstand aendert sich nur hier. Die Gegenprobe misst eine Eigenschaft von
//     ``tools/befehlswaechter.py``. Diese Datei aendert sich, wenn zanoria-common sich aendert —
//     nicht, wenn NexusStrike sich aendert. Achtmal je Commit dasselbe Invariant messen ist
//     nicht sparsam, sondern schlicht am falschen Ausloeser.
//   * ⚠️ ES LAEUFT WIRKLICH. zanoria-common hat eine CI (``.github/workflows/ci.yml``, push auf
//     main + jeder PR, ``./gradlew build`` — und ``build`` zieht ``check``). Von den ACHT
//     Verbrauchern haben nur DREI eine (Nexus, RelicWars, CoreClash); NexusStrike, Showdown,
//     ZanUI, ZanoriaCommands und ZanoriaLobby haben keine. Eine Anbindung je Verbraucher liefe
//     also bei fuenf von acht ueberhaupt nur, wenn ein Mensch dort von Hand ``check`` faehrt.
//   * Eine Aenderung an ``befehlswaechter.gradle`` trifft alle acht zugleich. Diese hier trifft
//     ein Repo.
//
//  GEGEN zentral — der Preis, benannt statt weggelassen
//   * ⚠️ Sie laeuft nur, wenn jemand zanoria-common baut. Wer ``tools/befehlswaechter.py``
//     oertlich aendert und danach nur die acht Verbraucher baut, bekommt acht gruene Laeufe und
//     keine Gegenprobe. Die CI faengt es beim Push — aber erst dort.
//   * Das schliesst kein Task und kein Kommentar. Es ist eine Arbeitsweise: WER
//     ``tools/befehlswaechter.py`` ANFASST, BAUT zanoria-common. Ein Kommentar ist kein Aufruf —
//     deshalb steht das hier als offener Befund und nicht als Zusicherung.
//
//  VERWORFEN: je Verbraucher zusaetzlich. Das haette den Preis oben bezahlt, aber acht Repos an
//  ein Ergebnis gehaengt, das keiner von ihnen beeinflussen kann. Zusaetzlich faellt die
//  Gegenprobe absichtlich auch dann rot, wenn ihr Mutationsanker im Waechter nicht mehr steht
//  ("NICHT GELAUFEN") — ein sauberer Umbau des Waechters wuerde damit acht fremde Baeume roeten,
//  bevor irgendwer den Anker nachzieht.
//
//
//  ⚠️ WAS DIE GEGENPROBE NICHT DECKT — am 2026-08-22 gemessen, nicht geschaetzt
//  ═══════════════════════════════════════════════════════════════════════════
//  22 Mutationen einzeln in den Waechter gesetzt und gemessen, welche auffliegt: 12 rot,
//  ZEHN still. Die stillen sind kein Restrisiko, sondern der Befund:
//    * Die Gegenprobe hat KEINEN Fall der Gegenrichtung. Sie kann Ueber-Meldung nicht sehen:
//      Kommentarabtrennung aus, ``deklarierte_befehle`` leer, ``aliases`` nicht mehr gezaehlt,
//      Erzeugungsregex zu streng — alles gruen. (Den Kommentarfall faengt wenigstens
//      ``befehlswaechter.py --selbsttest``, die anderen drei niemand.)
//    * Sie faengt nur die GANZE Toetung einer Probe, nicht die halbe: D ohne die
//      onTabComplete-Haelfte, E ohne CommandExecutor/TabExecutor/TabCompleter, E ohne
//      ``record`` — alles gruen.
//    * Sie prueft die Maschinerie um die Proben herum nicht: YAML-Kommentare, die Ausnahmedatei
//      (eine Ausnahme mit LEERER Begruendung darf nicht gelten), und — am schwersten — die
//      Stillegarantie selbst: wird ``return 2`` ("NICHTS GEPRUEFT") zu ``return 0``, bleiben
//      Gegenprobe UND Selbsttest gruen, und alle acht Repos melden einen bestandenen Lauf ueber
//      eine Pruefung, die keinen einzigen Deskriptor gesehen hat.
//  Diese Anbindung macht die Gegenprobe wirksam. Sie macht sie nicht vollstaendig.
// ═══════════════════════════════════════════════════════════════════════════════════════════

def gegenprobeSkript = file("${project.rootDir}/tools/waechter-gegenprobe.py")

// ⚠️ Absoluter Pfad, nie ein relativer. Standing Rule 16: ein relativer Aufruf lief ins Leere
// und der Lauf meldete trotzdem gruen.
def gegenprobePfad = gegenprobeSkript.absolutePath

tasks.register("waechterGegenprobe") {
    group = "verification"
    description = "Belegt, dass die fuenf Proben des Befehlswaechters wirklich pruefen" +
                  " (Gift + Mutant + Zeuge je Probe)."

    // ⚠️ Kein `inputs`/`outputs`, ausdruecklich kein UP-TO-DATE. `Task :x UP-TO-DATE` ist eine
    // Gruenmeldung ueber einen Lauf, der nicht stattgefunden hat — und dieser Task existiert
    // ausschliesslich dagegen. Er kostet wenige Sekunden; er laeuft lieber immer.
    outputs.upToDateWhen { false }

    doLast {
        if (!gegenprobeSkript.isFile()) {
            throw new GradleException(
                "Waechter-Gegenprobe: ${gegenprobePfad} fehlt. Der Befehlswaechter haengt in acht" +
                " Repos und waere damit wieder unbelegt. Kein Urteil ist nicht gruen.")
        }
        def waechterSkript = file("${project.rootDir}/tools/befehlswaechter.py")
        if (!waechterSkript.isFile()) {
            throw new GradleException(
                "Waechter-Gegenprobe: ${waechterSkript} fehlt — der Gegenstand der Pruefung ist" +
                " weg. Acht Verbraucher wenden dieses Skript an; ohne es brechen sie.")
        }

        // ⚠️ Der Interpreter wird gesucht, nicht geraten, und wenn keiner antwortet, BRICHT es
        // ab. Ein fehlender Interpreter darf nicht aussehen wie ein bestandener Lauf.
        def kandidaten = System.getProperty("os.name").toLowerCase().contains("win")
                ? ["py", "python", "python3"]
                : ["python3", "python"]
        def interpreter = null
        for (k in kandidaten) {
            try {
                def probe = new ByteArrayOutputStream()
                def r = project.exec {
                    commandLine k, "--version"
                    standardOutput = probe
                    errorOutput = probe
                    ignoreExitValue = true
                }
                if (r.exitValue == 0) { interpreter = k; break }
            } catch (ignored) { /* naechster Kandidat */ }
        }
        if (interpreter == null) {
            throw new GradleException(
                "Waechter-Gegenprobe: kein Python 3 gefunden (versucht: ${kandidaten.join(', ')})." +
                " Sie faellt NICHT auf gruen zurueck — ein Bau ohne Pruefung ist keine" +
                " bestandene Pruefung.")
        }

        def ausgabe = new ByteArrayOutputStream()
        def ergebnis = project.exec {
            commandLine interpreter, gegenprobePfad
            standardOutput = ausgabe
            errorOutput = ausgabe
            ignoreExitValue = true
        }
        logger.lifecycle(ausgabe.toString("UTF-8"))

        // ⚠️ Der Rueckgabecode entscheidet, nicht der Text. In einer Pipe entscheidet der letzte
        // Befehl, nicht der wichtige — hier wird der Wert getrennt festgehalten.
        switch (ergebnis.exitValue) {
            case 0:
                break
            case 1:
                throw new GradleException(
                    "Waechter-Gegenprobe: mindestens eine Probe des Befehlswaechters ist" +
                    " GEFALLEN — siehe oben. Entweder schlaegt sie auf ihrem Giftbaum nicht mehr" +
                    " an (dann ist sie blind und acht Repos bauen gruen ueber ungesehenem" +
                    " Befehlscode), oder ihre Entfernung aendert nichts (dann kam der Fund von" +
                    " woanders und die Zeile ist Deko), oder ihr Mutationsanker steht nicht mehr" +
                    " im Waechter (dann gibt es kein Urteil, und kein Urteil ist nicht gruen).")
            case 2:
                throw new GradleException(
                    "Waechter-Gegenprobe: ES LIEF NICHTS (Rueckgabe 2). Keine einzige Mutation" +
                    " wurde ausgefuehrt. Das ist kein bestandener Lauf, sondern eine Gegenprobe," +
                    " die nichts gegengeprueft hat.")
            default:
                throw new GradleException(
                    "Waechter-Gegenprobe: unerwartete Rueckgabe ${ergebnis.exitValue}.")
        }
    }
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
//  DER SELBSTTEST — bis zum 2026-08-22 rief ihn NIEMAND
//  ════════════════════════════════════════════════════
//  ⚠️ Der Kommentar weiter oben verlaesst sich an zwei Stellen woertlich darauf, dass
//  ``befehlswaechter.py --selbsttest`` etwas faengt ("Den Kommentarfall faengt wenigstens
//  ``befehlswaechter.py --selbsttest``"). Nur lief er in keinem Bau. Ein Werkzeug, das niemand
//  ruft, belegt nichts, egal was es koennte — dieselbe Feststellung steht im Kopf der
//  Gegenprobe ueber sie selbst, und sie galt danebenstehend weiter fuer den Selbsttest.
//  ⚠️ SCHADEN konkret: der Selbsttest deckt Faelle, die die Gegenprobe ausdruecklich NICHT
//  deckt — die Gegenrichtung (ein sauberes Plugin muss gruen sein), den Kommentarfall, und seit
//  dem 2026-08-22 die Ausnahmen in allen drei Lagen (WEG, GEGENSTANDSLOS, UNGEPRUEFT). Wer sie
//  hinzufuegt, ohne den Selbsttest anzubinden, schreibt eine Pflicht in Prosa und keine
//  Maschine.
// ═══════════════════════════════════════════════════════════════════════════════════════════

tasks.register("waechterSelbsttest") {
    group = "verification"
    description = "Laesst den Befehlswaechter gegen seine eigenen Wegwerfbaeume laufen" +
                  " (beide Richtungen, Kommentarfall, Ausnahmen)."

    // ⚠️ Dieselbe Begruendung wie oben: kein UP-TO-DATE. Ein Selbsttest, den Gradle
    // wegoptimiert, ist eine Gruenmeldung ueber einen Lauf, der nicht stattgefunden hat.
    outputs.upToDateWhen { false }

    doLast {
        def waechterSkript = file("${project.rootDir}/tools/befehlswaechter.py")
        if (!waechterSkript.isFile()) {
            throw new GradleException(
                "Waechter-Selbsttest: ${waechterSkript} fehlt. Acht Verbraucher wenden dieses" +
                " Skript an; kein Urteil ist nicht gruen.")
        }

        def kandidaten = System.getProperty("os.name").toLowerCase().contains("win")
                ? ["py", "python", "python3"]
                : ["python3", "python"]
        def interpreter = null
        for (k in kandidaten) {
            try {
                def probe = new ByteArrayOutputStream()
                def r = project.exec {
                    commandLine k, "--version"
                    standardOutput = probe
                    errorOutput = probe
                    ignoreExitValue = true
                }
                if (r.exitValue == 0) { interpreter = k; break }
            } catch (ignored) { /* naechster Kandidat */ }
        }
        if (interpreter == null) {
            throw new GradleException(
                "Waechter-Selbsttest: kein Python 3 gefunden (versucht:" +
                " ${kandidaten.join(', ')}). Er faellt NICHT auf gruen zurueck.")
        }

        def ausgabe = new ByteArrayOutputStream()
        def ergebnis = project.exec {
            commandLine interpreter, waechterSkript.absolutePath, "--selbsttest"
            standardOutput = ausgabe
            errorOutput = ausgabe
            ignoreExitValue = true
        }
        def text = ausgabe.toString("UTF-8")
        logger.lifecycle(text)

        // ⚠️ Der Rueckgabecode entscheidet. Zusaetzlich muss die Schlusszeile ueberhaupt da
        // sein: ein Skript, das vorher abstuerzt, kann jeden Code liefern, und "0 von 0
        // bestanden" waere kein bestandener Lauf, sondern gar keiner.
        if (!text.contains("Selbsttest:")) {
            throw new GradleException(
                "Waechter-Selbsttest: keine Schlusszeile 'Selbsttest: N von M bestanden' in der" +
                " Ausgabe. Der Lauf ist abgebrochen, bevor er ein Urteil hatte.")
        }
        if (ergebnis.exitValue != 0) {
            throw new GradleException(
                "Waechter-Selbsttest: mindestens ein Fall GEFALLEN (Rueckgabe" +
                " ${ergebnis.exitValue}) — siehe oben. Der Waechter haengt in acht Repos;" +
                " faellt hier die Gegenrichtung, schwaerzt er dort Sauberes an, und faellt eine" +
                " Probe, baut dort etwas gruen ueber ungesehenem Befehlscode.")
        }
    }
}

// ⚠️ An `check` haengen, nicht an `build`. `build` zieht `check` mit; umgekehrt nicht. Damit
// greift sie bei `./gradlew check`, bei `./gradlew build` und in der CI dieses Repos.
tasks.matching { it.name == "check" }.configureEach {
    dependsOn "waechterGegenprobe"
    dependsOn "waechterSelbsttest"
}
